<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroInspect AI | Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { primary: '#059669', 'primary-dark': '#047857', 'on-surface': '#191c1e', 'on-surface-variant': '#3d4a42', outline: '#6d7a72', 'outline-variant': '#bccac0' },
      fontFamily: { headline: ['Plus Jakarta Sans'], body: ['Inter'] }
    }}
  }
</script>
<style>
  .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body class="font-body overflow-hidden">

<div class="fixed inset-0 z-0">
  <div class="absolute inset-0 bg-gradient-to-br from-black/50 via-black/30 to-transparent z-10"></div>
  <div class="w-full h-full bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=1600&q=80')"></div>
</div>

<main class="relative z-20 min-h-screen flex items-center justify-center p-6">

  <!-- STEP 1: Role Selection -->
  <div id="step-role-select" class="step active glass-card w-full max-w-md rounded-2xl shadow-2xl p-10">
    <div class="flex items-center gap-3 mb-2 justify-center">
      <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" class="w-5 h-5"><path d="M3 21h18M5 21V7l8-4v18M13 21V11l6 3v7"/></svg>
      </div>
      <h1 class="font-headline text-2xl font-extrabold text-on-surface">AeroInspect <span class="text-primary">AI</span></h1>
    </div>
    <p class="text-xs text-on-surface-variant uppercase tracking-widest text-center mb-8">Enterprise Inspection Hub</p>

    <p class="text-sm text-center text-on-surface-variant mb-6">Select the type of account you're looking to access</p>

    <div class="grid grid-cols-2 gap-4">
      <button onclick="selectRole('admin')" class="group flex flex-col items-center gap-3 p-6 bg-white/60 border-2 border-outline-variant/40 rounded-xl hover:border-primary hover:bg-primary/5 transition-all">
        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center group-hover:bg-primary/20">
          <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" class="w-6 h-6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="text-center">
          <h3 class="font-bold text-sm">Admin</h3>
          <p class="text-[11px] text-on-surface-variant mt-1">Register as Admin</p>
        </div>
      </button>

      <button onclick="selectRole('inspector')" class="group flex flex-col items-center gap-3 p-6 bg-white/60 border-2 border-outline-variant/40 rounded-xl hover:border-primary hover:bg-primary/5 transition-all">
        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center group-hover:bg-primary/20">
          <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" class="w-6 h-6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div class="text-center">
          <h3 class="font-bold text-sm">Site Engineer</h3>
          <p class="text-[11px] text-on-surface-variant mt-1">Register as Inspector</p>
        </div>
      </button>
    </div>
  </div>

  <!-- STEP 2: Role-Specific Sign In / Sign Up -->
  <div id="step-role-page" class="step glass-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-10">
      <button onclick="backToRoleSelect()" class="flex items-center gap-2 text-primary font-bold text-xs uppercase tracking-wider mb-6">← Back</button>

      <h2 class="font-headline text-xl font-bold text-on-surface mb-1" id="role-page-title">—</h2>
      <p class="text-sm text-on-surface-variant mb-6" id="role-page-subtitle">—</p>

      <div class="flex gap-1 bg-[#f2f4f7] p-1 rounded-lg mb-6">
        <button onclick="switchAuthTab('signin')" id="tab-signin-btn" class="flex-1 py-2 rounded-md text-sm font-bold bg-white shadow-sm text-primary transition-all">Sign In</button>
        <button onclick="switchAuthTab('signup')" id="tab-signup-btn" class="flex-1 py-2 rounded-md text-sm font-bold text-on-surface-variant transition-all">Sign Up</button>
      </div>

      <div id="auth-error" class="hidden bg-red-50 text-red-600 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="auth-success" class="hidden bg-primary/10 text-primary text-sm px-4 py-3 rounded-lg mb-4"></div>

      <!-- Sign In Form -->
      <form id="signin-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wide">Username</label>
          <input id="login-username" type="text" required class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wide">Password</label>
          <input id="login-password" type="password" required class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
        </div>
        <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all mt-2">Sign In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wide">Username</label>
          <input id="register-username" type="text" required class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wide">Email</label>
          <input id="register-email" type="email" required class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wide">Password</label>
          <input id="register-password" type="password" required minlength="6" class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
        </div>
        <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all mt-2">Create Account</button>
        <p class="text-xs text-on-surface-variant text-center">Your account will need admin approval before you can sign in.</p>
      </form>

      <div class="w-full flex items-center gap-4 my-6">
        <div class="h-px flex-1 bg-outline-variant/40"></div>
        <span class="text-xs text-on-surface-variant font-medium">or</span>
        <div class="h-px flex-1 bg-outline-variant/40"></div>
      </div>

      <div id="google-signin-button" class="w-full flex justify-center"></div>

      <p id="login-hint" class="text-center text-xs text-on-surface-variant mt-5"></p>
    </div>
  </div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  const GOOGLE_CLIENT_ID = "933212632381-f8ne172rmk8qucfprd2c1398cjhmrcsn.apps.googleusercontent.com";
  const DEMO_CREDENTIALS = {
    admin: { username: "admin", password: "admin123" },
    inspector: { username: "inspector", password: "inspector123" },
  };
  let selectedRole = null;

  function selectRole(role) {
    selectedRole = role;
    document.getElementById("step-role-select").classList.remove("active");
    document.getElementById("step-role-page").classList.add("active");

    const roleLabel = role === "admin" ? "Admin" : "Site Engineer";
    document.getElementById("role-page-title").textContent = `${roleLabel} Access`;
    document.getElementById("role-page-subtitle").textContent = `Sign in to your account, or register a new ${roleLabel.toLowerCase()} account.`;
    document.getElementById("login-hint").textContent = `Demo credentials: ${DEMO_CREDENTIALS[role].username} / ${DEMO_CREDENTIALS[role].password}`;

    switchAuthTab("signin");
    clearMessages();
  }

  function backToRoleSelect() {
    document.getElementById("step-role-page").classList.remove("active");
    document.getElementById("step-role-select").classList.add("active");
    selectedRole = null;
  }

  function switchAuthTab(tab) {
    const signinBtn = document.getElementById("tab-signin-btn");
    const signupBtn = document.getElementById("tab-signup-btn");
    const signinForm = document.getElementById("signin-form");
    const signupForm = document.getElementById("signup-form");

    if (tab === "signin") {
      signinBtn.className = "flex-1 py-2 rounded-md text-sm font-bold bg-white shadow-sm text-primary transition-all";
      signupBtn.className = "flex-1 py-2 rounded-md text-sm font-bold text-on-surface-variant transition-all";
      signinForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
    } else {
      signupBtn.className = "flex-1 py-2 rounded-md text-sm font-bold bg-white shadow-sm text-primary transition-all";
      signinBtn.className = "flex-1 py-2 rounded-md text-sm font-bold text-on-surface-variant transition-all";
      signupForm.classList.remove("hidden");
      signinForm.classList.add("hidden");
    }
    clearMessages();
  }

  function clearMessages() {
    document.getElementById("auth-error").classList.add("hidden");
    document.getElementById("auth-success").classList.add("hidden");
  }

  async function handleLogin(event) {
    event.preventDefault();
    clearMessages();
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    try {
      await loginUser(username, password);
      window.location.href = "index.html";
    } catch (err) {
      const errorEl = document.getElementById("auth-error");
      errorEl.textContent = err.message || "Invalid username or password.";
      errorEl.classList.remove("hidden");
    }
  }

  async function handleRegister(event) {
    event.preventDefault();
    clearMessages();
    const username = document.getElementById("register-username").value.trim();
    const email = document.getElementById("register-email").value.trim();
    const password = document.getElementById("register-password").value;

    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password, role: selectedRole }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Registration failed");

      const successEl = document.getElementById("auth-success");
      successEl.textContent = data.message;
      successEl.classList.remove("hidden");
      document.getElementById("signup-form").reset();
    } catch (err) {
      const errorEl = document.getElementById("auth-error");
      errorEl.textContent = err.message;
      errorEl.classList.remove("hidden");
    }
  }

  async function handleGoogleSignIn(response) {
    try {
      const res = await fetch(`${API_BASE}/auth/google`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_token: response.credential }),
      });
      if (!res.ok) throw new Error("Google sign-in failed");
      const data = await res.json();
      saveSession(data.access_token, data.username, data.role);
      window.location.href = "index.html";
    } catch (err) {
      alert("Google sign-in isn't available yet — waiting on Cloud Console configuration. Please use the form above.");
    }
  }

  window.onload = function () {
    if (typeof google !== "undefined") {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleSignIn });
      google.accounts.id.renderButton(document.getElementById("google-signin-button"), { theme: "outline", size: "large", width: 300 });
    }
  };
</script>
</body>
</html>
