name: Build and push backend container image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements-server.txt"
      - "backend/**"
      - ".github/workflows/build-backend-image.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and push to Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler containers build -p -t aeroinspect-backend:latest .
